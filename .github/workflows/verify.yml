# The house's verification, on every push — the manual session checks
# (build, lint, font-preload invariant, browser walkthrough) made a
# standing gate. Local equivalent: npm run lint && npm run build && npm run verify

name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Font-preload invariant
        run: node scripts/verify/font-preloads.mjs

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Walkthrough
        run: node scripts/verify/walkthrough.mjs
